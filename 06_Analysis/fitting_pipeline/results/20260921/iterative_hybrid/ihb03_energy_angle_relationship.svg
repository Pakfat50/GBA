<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470">
<rect width="940" height="470" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#202124}.axis{stroke:#444;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}.obs{stroke:#1769aa;stroke-width:4}.mod{stroke:#e87500;stroke-width:4}.start{stroke:#333;stroke-width:4}.arrow{stroke:#555;stroke-width:2;marker-end:url(#arrow)}.small{font-size:13px}.label{font-size:15px}.title{font-size:18px;font-weight:bold}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="470" y="30" text-anchor="middle" class="title">One measured half-cycle: energy levels and energy loss</text>
<text x="230" y="62" text-anchor="middle" class="label">Full energy scale</text>
<text x="705" y="62" text-anchor="middle" class="label">Zoom near the turning-point energies</text>
<!-- left panel axis: 0 to 12 mJ, y=390 to 95 -->
<line x1="70" y1="95" x2="70" y2="390" class="axis"/><line x1="70" y1="390" x2="405" y2="390" class="axis"/>
<text x="34" y="102" class="small">12</text><text x="42" y="248" class="small">6</text><text x="48" y="395" class="small">0</text><text x="20" y="235" transform="rotate(-90 20,235)" class="small">Energy [mJ]</text>
<line x1="70" y1="242.5" x2="405" y2="242.5" class="grid"/>
<line x1="155" y1="120.2" x2="155" y2="390" class="start"/><circle cx="155" cy="120.2" r="6" fill="#333"/>
<line x1="260" y1="139.0" x2="260" y2="390" class="obs"/><circle cx="260" cy="139.0" r="6" fill="#1769aa"/>
<line x1="355" y1="131.6" x2="355" y2="390" class="mod"/><circle cx="355" cy="131.6" r="6" fill="#e87500"/>
<text x="155" y="415" text-anchor="middle" class="small">Start</text><text x="260" y="415" text-anchor="middle" class="small">Observed end</text><text x="355" y="415" text-anchor="middle" class="small">ODE-model end</text>
<text x="155" y="108" text-anchor="middle" class="small">10.971</text><text x="260" y="158" text-anchor="middle" class="small">10.177</text><text x="355" y="120" text-anchor="middle" class="small">10.487</text>
<!-- right panel zoom -->
<line x1="515" y1="95" x2="515" y2="390" class="axis"/><line x1="515" y1="390" x2="895" y2="390" class="axis"/>
<text x="479" y="102" class="small">11.2</text><text x="479" y="176" class="small">10.9</text><text x="479" y="250" class="small">10.6</text><text x="479" y="324" class="small">10.3</text><text x="479" y="395" class="small">10.0</text>
<text x="464" y="235" transform="rotate(-90 464,235)" class="small">Energy [mJ] (zoom)</text>
<line x1="515" y1="169" x2="895" y2="169" class="grid"/><line x1="515" y1="243" x2="895" y2="243" class="grid"/><line x1="515" y1="317" x2="895" y2="317" class="grid"/>
<!-- y mapping 11.2 at 95, 10.0 at 390 -->
<line x1="625" y1="151.3" x2="625" y2="390" class="start"/><circle cx="625" cy="151.3" r="6" fill="#333"/>
<line x1="750" y1="346.6" x2="750" y2="390" class="obs"/><circle cx="750" cy="346.6" r="6" fill="#1769aa"/>
<line x1="845" y1="326.1" x2="845" y2="390" class="mod"/><circle cx="845" cy="270.4" r="6" fill="#e87500"/>
<!-- labels in zoom -->
<text x="625" y="138" text-anchor="middle" class="small">10.971</text><text x="750" y="367" text-anchor="middle" class="small">10.177</text><text x="845" y="258" text-anchor="middle" class="small">10.487</text>
<line x1="648" y1="152" x2="648" y2="346" class="arrow"/><text x="658" y="242" class="small">ΔEobs = 0.794 mJ</text>
<line x1="868" y1="152" x2="868" y2="270" class="arrow"/><text x="877" y="220" class="small">ΔEODE = 0.484 mJ</text>
<line x1="735" y1="275" x2="833" y2="275" class="arrow"/><text x="785" y="292" text-anchor="middle" class="small">end-energy gap 0.311 mJ</text>
<text x="470" y="452" text-anchor="middle" class="small">Illustrative real interval: IN_SP00_N_R01, peak pair 1→2; not a group average.</text>
</svg>